; BSides Orlando 2026 badge -- CH32V003 firmware
; see https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
src_dir = .
include_dir = .
default_envs = bsorl26

[env:bsorl26]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
monitor_speed = 115200

; ch32fun is a git submodule; its library sources sit in ch32fun/ch32fun and
; the optional drivers (WS2812 DMA/SPI, cap touch) in ch32fun/extralibs.
; -Isrc is what lets ch32fun.c find our funconfig.h, and what lets the SAOv3
; host library find our saoh_config.h.
;
; The SAOv3 host library (saov3-lib/host/saoh_core) is not a PlatformIO
; library like the device side is, so its sources are pulled in through the
; src filter below and its headers through -I flags. log.c and err.c are
; deliberately left out: logging is compiled to LOGL_NONE (see saoh_config.h)
; so nothing references them, and they would only pull printf/sprintf and a
; string table into a 16K part.
build_flags =
  -flto
  ; The host library uses C11 static_assert; the platform's default C
  ; standard predates assert.h providing that macro, but the underlying
  ; keyword is still there.
  -Dstatic_assert=_Static_assert
  -Ich32fun/ch32fun
  -Ich32fun/extralibs
  -Isaov3-lib/host/saoh_core/include
  -Isrc
  -lgcc

build_src_filter =
  +<src>
  +<ch32fun/ch32fun/ch32fun.c>
  +<saov3-lib/host/saoh_core/src/smbus_i2c_shim.c>
  +<saov3-lib/host/saoh_core/src/discovery.c>
  +<saov3-lib/host/saoh_core/src/itf.c>

; Generates the linker script on the fly from ch32fun.ld, deriving TARGET_MCU
; and friends from the board above -- the same way the upstream Makefile does.
extra_scripts =
  pre:scripts/gen_ldscript.py
  pre:scripts/gen_text.py

; Upload via picorvd (an RP2040 acting as a ch32v003 debugger). The helper
; resolves the probe's GDB port and a RISC-V gdb at upload time -- the /dev name
; changes with the physical USB port, so it cannot be hardcoded, and
; upload_protocol = custom passes upload_port through verbatim with no
; autodetection. Override with PICORVD_PORT / PICORVD_GDB if it guesses wrong.
upload_protocol = custom
upload_command = "$PROJECT_DIR/scripts/picorvd_upload.sh" "$BUILD_DIR/${PROGNAME}.elf"

debug_tool = custom
; debug_port gets no autodetection hook, so it has to name the GDB port
; literally. Run scripts/picorvd_upload.sh with no arguments to see the
; detected name.
debug_port = /dev/cu.usbmodem103
debug_init_cmds =
  target extended-remote $DEBUG_PORT
  monitor reset
  $LOAD_CMDS
  $INIT_BREAK
